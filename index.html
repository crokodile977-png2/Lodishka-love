<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кликер</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #score {
            font-size: 30px;
            margin: 20px;
        }

        #game {
            position: relative;
            height: 300px;
        }

        #clickImage {
            width: 200px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 50px;
        }

        #van {
            display: none;
            position: absolute;
            width: 250px;
            top: 40px;
            font-size: 150px;
        }

        .drive-right {
            display: block !important;
            animation: driveRight 2s linear forwards;
        }

        .drive-left {
            display: block !important;
            animation: driveLeft 2s linear forwards;
        }

        @keyframes driveRight {
            from {
                left: 50%;
            }

            to {
                left: 110%;
            }
        }

        @keyframes driveLeft {
            from {
                left: -300px;
            }

            to {
                left: 50%;
            }
        }
    </style>
</head>

<body>

    <div id="score">Тапов: 0</div>

    <div id="game">

        <!-- Картинка для тапов -->
        <img
            id="clickImage"
            src="click.jpg"
            onclick="clicker()"
        >

        <!-- Минивэн -->
        <div id="van">
            🚐
        </div>

    </div>

    <script>
        let score = 0;

        const clickImage = document.getElementById("clickImage");
        const van = document.getElementById("van");

        function clicker() {
            score++;

            document.getElementById("score").textContent =
                "Тапов: " + score;

            // Каждые 100 тапов
            if (score % 100 === 0) {
                drive();
            }
        }

        function drive() {

            // Прячем картинку
            clickImage.style.display = "none";

            // Показываем минивэн
            van.className = "drive-right";

            // Через 2 секунды минивэн уезжает за экран
            setTimeout(() => {

                van.className = "";

                // Перемещаем его за левый край
                van.style.left = "-300px";

                // Небольшая пауза
                setTimeout(() => {

                    // Минивэн едет обратно
                    van.className = "drive-left";

                    // Через 2 секунды он возвращается
                    setTimeout(() => {

                        van.className = "";
                        van.style.display = "none";

                        // Возвращаем картинку
                        clickImage.style.display = "block";

                    }, 2000);

                }, 100);

            }, 2000);
        }
    </script>

</body>
</html>
